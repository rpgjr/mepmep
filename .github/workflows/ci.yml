name: CI/CD

# When this pipeline runs
on:
  push:
    branches: [main]
  pull_request:

# The pipeline may only read the repo by default (least privilege)
permissions:
  contents: read

jobs:
  # ---------- 1. run the tests ----------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Compile and run tests
        run: mvn -B verify
      - name: Keep the test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: target/surefire-reports

  # ---------- 2. build the Docker image, scan it, push it ----------
  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # allows pushing to GitHub Container Registry
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Image name and tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build image (not pushed yet)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: mepmep:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image for known vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mepmep:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0" # report only. Change to "1" to fail the build on findings
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  # ---------- 3. deploy (only after a push to main) ----------
  deploy:
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret is not set. Skipping deploy."
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
