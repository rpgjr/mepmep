# Dependabot opens pull requests when a library, Docker image or Action has a new version.
# Monthly and grouped, so it is one PR per ecosystem and not a weekly flood.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule: { interval: monthly }
    groups:
      maven-updates:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions-updates:
        patterns: ["*"]
